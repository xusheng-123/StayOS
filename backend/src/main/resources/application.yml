spring:
  application:
    name: stayos
  datasource:
    url: jdbc:postgresql://127.0.0.1:${STAYOS_DB_PORT:15432}/${STAYOS_DB_NAME:stayos}
    username: ${STAYOS_DB_USER:stayos}
    password: ${STAYOS_DB_PASSWORD}
  flyway:
    clean-disabled: true
  jackson:
    time-zone: Asia/Shanghai
server:
  address: ${STAYOS_BIND_ADDRESS:127.0.0.1}
  port: ${STAYOS_BACKEND_PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: STAYOS_SESSION
        http-only: true
        same-site: strict
        secure: ${STAYOS_COOKIE_SECURE:false}
        path: /
  error:
    include-message: never
    include-stacktrace: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
stayos:
  guests:
    encryption-key: ${STAYOS_GUEST_ENCRYPTION_KEY:}
  auth:
    max-failures: 5
    lock-duration: 15m
    ip-limit: 60
    ip-window: 1m

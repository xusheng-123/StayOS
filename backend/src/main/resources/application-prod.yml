# The production reverse proxy must terminate HTTPS on the same public site.
spring:
  datasource:
    username: ${STAYOS_RUNTIME_DB_USER}
    password: ${STAYOS_RUNTIME_DB_PASSWORD}
  flyway:
    user: ${STAYOS_MIGRATION_DB_USER}
    password: ${STAYOS_MIGRATION_DB_PASSWORD}
stayos:
  guests:
    key-fingerprint: ${STAYOS_GUEST_KEY_FINGERPRINT}
logging:
  file:
    name: ${STAYOS_LOG_DIR:./.local/logs}/stayos.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 1GB
server:
  servlet:
    session:
      cookie:
        secure: true
